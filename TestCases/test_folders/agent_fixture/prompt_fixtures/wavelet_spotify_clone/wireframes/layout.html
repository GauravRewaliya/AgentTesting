<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{--bg:#0f0d1a;--p:#1a1730;--ink:#eee;--mut:#9a95b8;--acc:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:12px system-ui;height:100vh;display:grid;grid-template-columns:120px 1fr 150px;grid-template-rows:1fr 54px;gap:6px;padding:6px}
div{background:var(--p);border-radius:8px;padding:8px}.m{color:var(--mut)}.pl{grid-column:1/4;display:flex;align-items:center;justify-content:space-between}.bar{height:5px;flex:1;margin:0 14px;background:#2d2850;border-radius:3px}.bar i{display:block;width:35%;height:100%;background:var(--acc);border-radius:3px}
.cov{height:90px;border-radius:6px;background:linear-gradient(135deg,#8b5cf6,#ec4899);margin-bottom:6px}.row{border-bottom:1px solid #2d2850;padding:4px 0}b{cursor:pointer}</style>
